name: Compile MRS
on:
  push:
    paths:
      - 'rules/**'
  workflow_dispatch:

# 解决 Node.js 20 弃用警告，强制使用 Node 24 运行时
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Mihomo
        run: |
          # 使用 1.18.0，这个版本在 CLI 转换模式下最稳定
          curl -L -o temp.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.0/mihomo-linux-amd64-v1.18.0.gz
          gunzip -c temp.gz > ./mihomo
          chmod +x ./mihomo
          ./mihomo -v

      - name: Compile Rulesets
        run: |
          # 1. 确认 rules 文件夹存在
          if [ ! -d "rules" ]; then
            echo "❌ 错误：在仓库根目录下找不到 'rules' 文件夹！"
            exit 1
          fi

          echo "🏗️ 开始转换域名规则..."
          # 使用 timeout 10s，防止它误入代理模式导致卡死
          timeout 10s ./mihomo convert ruleset domain ./rules/apple_push_domain.yaml ./apple_push_domain.mrs || echo "域名转换遇到异常"

          echo "🏗️ 开始转换 IP 规则..."
          timeout 10s ./mihomo convert ruleset ipcidr ./rules/apple_push_ip.yaml ./apple_push_ip.mrs || echo "IP 转换遇到异常"
          
          # 2. 检查结果
          if [ -f "apple_push_domain.mrs" ] && [ -f "apple_push_ip.mrs" ]; then
            echo "✅ 所有规则编译顺利完成！"
          else
            echo "❌ 编译失败，未生成 .mrs 文件，请检查 YAML 格式。"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.mrs
          git commit -m "Auto-compile MRS: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
