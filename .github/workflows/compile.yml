name: Mihomo MRS Auto Compiler (Stable)

on:
  push:
    paths:
      - 'rules/**'
  workflow_dispatch:

jobs:
  build-and-convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 动态下载最新稳定版内核 (Latest Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 正在从 Latest Release 中抓取 Linux-amd64 资源..."
          
          # 不指定 Tag，gh 默认下载最新稳定版 (v1.x.x)
          # 匹配规则改为包含版本号的格式，例如 mihomo-linux-amd64-v1.19.24.gz
          gh release download --repo MetaCubeX/mihomo \
                              --pattern "mihomo-linux-amd64-v*.gz" \
                              --output mihomo.gz \
                              --clobber
          
          echo "📦 正在解压并配置内核..."
          if [ -f "mihomo.gz" ]; then
            gunzip -f mihomo.gz
            chmod +x mihomo
            ./mihomo -v
          else
            echo "❌ 未能找到稳定版文件，请检查 MetaCubeX/mihomo 的 Release 页面文件名格式"
            exit 1
          fi

      - name: 3. 执行规则转换 (YAML -> MRS)
        run: |
          echo "🏗️ 开始转码..."
          mkdir -p publish
          
          # 转换域名规则
          if [ -f "rules/apns_domain.yaml" ]; then
            # 这里的指令必须确保稳定版内核也支持 convert-ruleset
            ./mihomo convert-ruleset domain yaml rules/apns_domain.yaml publish/apns.mrs
          fi
          
          # 转换 IP 规则
          if [ -f "rules/apns_ip.yaml" ]; then
            ./mihomo convert-ruleset ipcidr yaml rules/apns_ip.yaml publish/apns_ip.mrs
          fi
          
          echo "✅ 转换完成，当前文件清单："
          ls -lh publish/

      - name: 4. 推送 MRS 文件到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add publish/*.mrs
          if git diff --staged --quiet; then
            echo "没有新变动，跳过推送。"
            exit 0
          fi
          git commit -m "Auto-compile MRS (Stable): $(date +'%Y-%m-%d %H:%M:%S')"
          git push
