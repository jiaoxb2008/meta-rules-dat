name: Mihomo MRS Auto Compiler

on:
  push:
    paths:
      - 'rules/**'       # 只有 rules 文件夹下的文件变动时才触发
  workflow_dispatch:     # 支持手动点击按钮执行

jobs:
  build-and-convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 赋予推送到仓库的权限

    steps:
      - name: 1. 拉取当前仓库代码
        uses: actions/checkout@v4

      - name: 2. 动态下载最新 Alpha 版内核
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 正在搜索 MetaCubeX/mihomo 最新 Alpha 资源..."
          # 自动寻找 linux-amd64 架构的 alpha 版本 gz 包
          gh release download --repo MetaCubeX/mihomo \
                              --pattern "mihomo-linux-amd64-alpha-*.gz" \
                              --output mihomo.gz \
                              --clobber
          
          echo "📦 正在解压并配置内核..."
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: 3. 执行规则转换 (YAML -> MRS)
        run: |
          echo "🏗️ 开始转码..."
          # 创建发布文件夹
          mkdir -p publish
          
          # 定义转换函数，方便批量处理
          # 指令逻辑：convert-ruleset <类型> <源格式> <源文件> <目标文件>
          
          # 转换苹果域名规则
          if [ -f "rules/apns_domain.yaml" ]; then
            ./mihomo convert-ruleset domain yaml rules/apns_domain.yaml publish/apns_domain.mrs
          fi
          
          # 转换苹果 IP 规则
          if [ -f "rules/apns_ip.yaml" ]; then
            ./mihomo convert-ruleset ipcidr yaml rules/apns_ip.yaml publish/apns_ip.mrs
          fi
          
          # 如果你有其他规则，按上面的格式继续添加即可
          
          echo "✅ 转换完成，当前 publish 目录文件："
          ls -lh publish/

      - name: 4. 推送编译好的 MRS 文件到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 检查是否有文件变动
          git add publish/*.mrs
          if git diff --staged --quiet; then
            echo "Nothin to commit."
            exit 0
          fi
          
          git commit -m "Auto-compile MRS: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
