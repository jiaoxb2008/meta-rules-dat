name: Compile MRS
on:
  push:
    paths:
      - 'rules/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Mihomo v1.19.24
        run: |
          # 1. 坐标锁定：下载你指定的 v1.19.24 版本
          # 使用通配符匹配 linux-amd64，避开繁琐的完整文件名
          gh release download v1.19.24 --repo MetaCubeX/mihomo --pattern "mihomo-linux-amd64-*.gz" --output download.gz
          
          # 2. 解压并重命名
          gunzip -c download.gz > ./mihomo
          chmod +x ./mihomo
          
          # 3. 验证版本
          ./mihomo -v
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile Rulesets
        run: |
          echo "🏗️ 正在使用 v1.19.24 转换二进制规则..."
          
          # 核心修正：1.19.x 的标准语法是 ruleset convert
          # 语法：ruleset convert [行为] [输入路径] [输出路径]
          
          if [ -f "rules/apple_push_domain.yaml" ]; then
            ./mihomo ruleset convert domain ./rules/apple_push_domain.yaml ./apple_push_domain.mrs
          fi
          
          if [ -f "rules/apple_push_ip.yaml" ]; then
            ./mihomo ruleset convert ipcidr ./rules/apple_push_ip.yaml ./apple_push_ip.mrs
          fi
          
          # 验证结果
          ls -lh *.mrs
          echo "✅ 编译顺利完成！"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.mrs
          git commit -m "Auto-compile MRS (v1.19.24): $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
