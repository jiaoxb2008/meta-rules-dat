name: Mihomo MRS Auto Compiler

on:
  push:
    paths:
      - 'src/**' # 1. 监听 src 文件夹的变化
  workflow_dispatch:

jobs:
  build-and-convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v5

      - name: 2. 动态下载最新稳定版内核
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 正在筛选标准版 Linux-amd64 资源..."
          gh release download --repo MetaCubeX/mihomo \
                              --pattern "mihomo-linux-amd64-v*.gz" \
                              --clobber

          RAW_FILE=$(ls mihomo-linux-amd64-v*.gz | grep -vE "compatible|v[123]-|go" | head -n 1)
          mv "$RAW_FILE" mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo

      - name: 3. 执行规则转换 (src -> dist)
        run: |
          echo "🏗️ 开始转码..."
          # 2. 自动创建 dist 文件夹
          mkdir -p dist

          # 3. 更新转换路径 (源在 src，产物在 dist)
          # 指令：convert-ruleset <类型> <源格式> <源文件> <目标文件>
          for file in src/*.yaml; do
            [ -e "$file" ] || continue
            filename=$(basename "$file" .yaml)

            # 根据文件名后缀自动判断类型（*_ip.yaml 走 ipcidr，其他默认走 domain）
            if [[ "$filename" == *_ip ]]; then
              ./mihomo convert-ruleset ipcidr yaml "$file" "dist/${filename}.mrs"
            else
              ./mihomo convert-ruleset domain yaml "$file" "dist/${filename}.mrs"
            fi
          done

          echo "✅ 转换完成，当前产物："
          ls -lh dist/

      - name: 4. 推送 MRS 文件到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 4. 更新 Git 跟踪的路径
          git add dist/*.mrs

          if git diff --staged --quiet; then
            echo "没有新变动，跳过推送。"
            exit 0
          fi

          git commit -m "Build: auto-generate MRS from src (Stable) $(date +'%Y-%m-%d %H:%M:%S')"
          git pull --rebase
          git push
