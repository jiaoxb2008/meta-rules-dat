name: Compile MRS
on:
  push:
    paths:
      - 'rules/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get Mihomo
        run: |
          # 自动获取最新版本并下载
          TAG=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep tag_name | cut -d '"' -f 4)
          curl -L -o mihomo.tar.gz https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-amd64-${TAG}.tar.gz
          tar -xzf mihomo.tar.gz
          mv mihomo-linux-amd64* mihomo
          chmod +x mihomo

      - name: Compile
        run: |
          ./mihomo convert ruleset domain rules/apple_push_domain.yaml apple_push_domain.mrs
          ./mihomo convert ruleset ipcidr rules/apple_push_ip.yaml apple_push_ip.mrs

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.mrs
          git commit -m "Update binary MRS files" || exit 0
          git push
