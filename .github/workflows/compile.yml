name: Compile MRS
on:
  push:
    paths:
      - 'rules/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Mihomo (Turbo Mode)
        run: |
          # 获取带 v 且最基础的 linux-amd64 下载直链
          DL_URL=$(gh release view --repo MetaCubeX/mihomo --json assets --jq '.assets[] | select(.name | test("^mihomo-linux-amd64-v.*\\.gz$")) | .browser_download_url' | head -n 1)
          
          if [ -z "$DL_URL" ]; then
            echo "未抓取到带 v 的版本，尝试抓取通用版..."
            DL_URL=$(gh release view --repo MetaCubeX/mihomo --json assets --jq '.assets[] | select(.name | contains("linux-amd64") and endswith(".gz")) | .browser_download_url' | head -n 1)
          fi

          echo "🚀 目标下载链接: $DL_URL"
          
          # 使用 curl 直接下载，带上进度显示
          curl -L -o mihomo.gz "$DL_URL"
          
          echo "📦 正在解压..."
          gunzip -c mihomo.gz > ./mihomo
          chmod +x ./mihomo
          
          echo "✅ Mihomo 内核准备就绪！"
          ./mihomo -v
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile Rulesets
        run: |
          echo "🏗️ 正在编译 .mrs 规则..."
          ./mihomo convert ruleset domain rules/apple_push_domain.yaml apple_push_domain.mrs
          ./mihomo convert ruleset ipcidr rules/apple_push_ip.yaml apple_push_ip.mrs
          echo "✨ 编译完成！"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.mrs
          git commit -m "Auto-compile MRS: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
