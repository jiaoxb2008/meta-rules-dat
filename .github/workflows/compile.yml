name: Compile MRS
on:
  push:
    paths:
      - 'rules/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Mihomo (Fixed)
        run: |
          # 1. 抓取最新 Release 的版本号和文件名
          # 我们先用 gh 拿到最新版的 Tag
          TAG=$(gh release view --repo MetaCubeX/mihomo --json tagName --jq '.tagName')
          
          # 2. 锁定我们要的文件名模式 (linux-amd64-v 开头的 .gz)
          # 注意：这里我们抓取 .name，这个字段在 gh 里是绝对存在的
          ASSET_NAME=$(gh release view --repo MetaCubeX/mihomo --json assets --jq ".assets[] | select(.name | test(\"mihomo-linux-amd64-v.*\\\\.gz$\")) | .name" | head -n 1)
          
          echo "🏷️ Tag: $TAG"
          echo "📦 Asset: $ASSET_NAME"

          # 3. 拼接直链。这是 GitHub 最稳的下载路径格式
          DL_URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/${ASSET_NAME}"
          echo "🚀 最终下载地址: $DL_URL"

          # 4. 使用 curl 下载，加上 -f (报错即停止) 和 -sS (静默但显示错误)
          curl -L -f -o mihomo.gz "$DL_URL"
          
          # 5. 解压并赋予权限
          gunzip -c mihomo.gz > ./mihomo
          chmod +x ./mihomo
          
          # 验证
          ./mihomo -v
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile Rulesets
        run: |
          # 编译逻辑保持不变
          ./mihomo convert ruleset domain rules/apple_push_domain.yaml apple_push_domain.mrs
          ./mihomo convert ruleset ipcidr rules/apple_push_ip.yaml apple_push_ip.mrs

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.mrs
          git commit -m "Auto-compile MRS: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
