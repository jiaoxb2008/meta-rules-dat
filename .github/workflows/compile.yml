name: Compile MRS
on:
  push:
    paths:
      - 'rules/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Mihomo (Stable)
        run: |
          # 1. 坐标锁定：直接使用 gh 下载 1.18.3 稳定版
          # 这样能避开 1.19 版本会自动开启代理服务的 Bug
          gh release download v1.18.3 --repo MetaCubeX/mihomo --pattern "mihomo-linux-amd64-v1.18.3.gz" --output download.gz
          
          # 2. 流式解压：直接输出到 ./mihomo，彻底杜绝 mv 报错
          gunzip -c download.gz > ./mihomo
          chmod +x ./mihomo
          
          # 3. 验证：打出版本号
          ./mihomo -v
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile Rulesets
        run: |
          echo "🏗️ 正在编译规则..."
          
          # 域名转换
          if [ -f "rules/apple_push_domain.yaml" ]; then
            ./mihomo convert ruleset domain rules/apple_push_domain.yaml apple_push_domain.mrs
          fi
          
          # IP 转换
          if [ -f "rules/apple_push_ip.yaml" ]; then
            ./mihomo convert ruleset ipcidr rules/apple_push_ip.yaml apple_push_ip.mrs
          fi
          
          # 检查结果
          ls -lh *.mrs
          echo "✅ 编译完成！"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.mrs
          git commit -m "Auto-compile MRS: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
