name: Compile MRS
on:
  push:
    paths:
      - 'rules/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Mihomo (Stable version)
        run: |
          # 锁定 v1.18.3 稳定版，这个版本的 convert 命令极其标准
          curl -L -o mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.3/mihomo-linux-amd64-v1.18.3.gz
          gunzip mihomo.gz
          mv mihomo-linux-amd64* mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Compile Rulesets
        run: |
          # 加上具体的转换指令，确保它执行完就退出，不启动服务
          echo "🚀 开始转换域名规则..."
          ./mihomo convert ruleset domain rules/apple_push_domain.yaml apple_push_domain.mrs
          
          echo "🚀 开始转换 IP 规则..."
          ./mihomo convert ruleset ipcidr rules/apple_push_ip.yaml apple_push_ip.mrs
          echo "✅ 编译成功！"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.mrs
          git commit -m "Auto-compile MRS: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
