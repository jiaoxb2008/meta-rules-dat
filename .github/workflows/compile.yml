name: Compile MRS
on:
  push:
    paths:
      - 'rules/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Mihomo Alpha (The Real One)
        run: |
          # 1. 抓取 Alpha 版本的最新内核，这个版本一定包含规则转换工具
          gh release download Alpha --repo MetaCubeX/mihomo --pattern "mihomo-linux-amd64-alpha-*.gz" --output alpha.gz
          
          # 2. 解压并重命名
          gunzip -c alpha.gz > ./mihomo
          chmod +x ./mihomo
          
          # 3. 打印版本信息验证
          ./mihomo -v
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile Rulesets
        run: |
          echo "🏗️ 正在二进制编译苹果推送规则..."
          
          # 注意：Mihomo Alpha 的标准转换语法
          # 格式：./mihomo convert-ruleset [行为] [输入格式] [输入路径] [输出路径]
          
          if [ -f "rules/apple_push_domain.yaml" ]; then
            ./mihomo convert-ruleset domain yaml ./rules/apple_push_domain.yaml ./apple_push_domain.mrs
          fi
          
          if [ -f "rules/apple_push_ip.yaml" ]; then
            ./mihomo convert-ruleset ipcidr yaml ./rules/apple_push_ip.yaml ./apple_push_ip.mrs
          fi
          
          # 检查文件大小，确保不是 0
          ls -lh *.mrs
          echo "✅ 编译顺利完成！"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.mrs
          # 即使文件没变化也强制更新，方便看 Action 运行状态
          git commit -m "Auto-compile MRS: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
