name: Compile MRS
on:
  push:
    paths:
      - 'rules/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Mihomo Core
        run: |
          # 1. 下载公认最稳的 v1.18.3 稳定版
          curl -L -o temp.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.3/mihomo-linux-amd64-v1.18.3.gz
          gunzip -c temp.gz > ./mihomo
          chmod +x ./mihomo
          ./mihomo -v

      - name: Compile Rulesets
        run: |
          echo "🏗️ 开始二进制编译..."
          
          # 注意：命令必须是 convert-ruleset (带连字符)，后面紧跟：行为 格式 输入 输出
          # 域名规则编译
          ./mihomo convert-ruleset domain yaml ./rules/apple_push_domain.yaml ./apple_push_domain.mrs
          
          # IP 规则编译
          ./mihomo convert-ruleset ipcidr yaml ./rules/apple_push_ip.yaml ./apple_push_ip.mrs
          
          # 验证文件是否生成
          if [ -f "apple_push_domain.mrs" ] && [ -f "apple_push_ip.mrs" ]; then
            echo "✅ 编译成功，MRS 二进制文件已生成！"
            ls -lh *.mrs
          else
            echo "❌ 编译失败，请检查 rules/ 目录下的 YAML 格式。"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.mrs
          git commit -m "Auto-compile MRS: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
